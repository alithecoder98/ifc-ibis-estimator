name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ifc_ibis
          POSTGRES_PASSWORD: ifc_ibis_dev
          POSTGRES_DB: ifc_ibis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ifc_ibis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ifc_ibis:ifc_ibis_dev@localhost:5432/ifc_ibis
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:3900
      S3_BUCKET: ifc-uploads
      S3_REGION: garage
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node_fragments dependencies
        run: npm ci
        working-directory: apps/api/node_fragments

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Start Garage (S3-compatible storage)
        # Every test that uploads/downloads a real file (extraction, export,
        # fragments, upload endpoints) hits real S3-compatible storage, not a
        # mock - found live: CI has been failing on every single push since the
        # repo was first made public because this was never set up here at all,
        # only Postgres/Redis were. The declarative `services:` block above
        # can't mount a config file, and Garage needs one (two generated
        # secrets, data/meta dirs) - see garage/garage.toml.example - so this
        # starts it as a plain container step instead, mirroring both
        # docker-compose.yml's garage service and the bootstrap sequence
        # README.md documents for local setup. classification_engine defaults
        # to "jev" (a stub, not a real call) in every test that doesn't
        # explicitly ask for the LLM engine, so Ollama is never actually
        # needed here - confirmed by checking classify_elements() only builds
        # an embedder/LLM client when engine is "llm"/"both".
        run: |
          mkdir -p /tmp/garage/data /tmp/garage/meta
          cat > /tmp/garage/garage.toml <<EOF
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "lmdb"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "$(openssl rand -hex 32)"
          [s3_api]
          s3_region = "garage"
          api_bind_addr = "[::]:3900"
          root_domain = ".s3.garage.localhost"
          [admin]
          api_bind_addr = "[::]:3903"
          admin_token = "$(openssl rand -hex 32)"
          EOF
          docker run -d --name garage --network host \
            -v /tmp/garage/garage.toml:/etc/garage.toml:ro \
            -v /tmp/garage/data:/var/lib/garage/data \
            -v /tmp/garage/meta:/var/lib/garage/meta \
            dxflrs/garage:v1.0.1

          for i in $(seq 1 20); do
            docker exec garage /garage status && break
            sleep 2
          done

          NODE_ID=$(docker exec garage /garage status | grep -A2 "HEALTHY NODES" | tail -1 | awk '{print $1}')
          docker exec garage /garage layout assign "$NODE_ID" -z dc1 -c 1G
          docker exec garage /garage layout apply --version 1
          docker exec garage /garage bucket create ifc-uploads
          docker exec garage /garage key create ifc-ibis-ci-key > /tmp/garage/key-output.txt
          docker exec garage /garage bucket allow --read --write ifc-uploads --key ifc-ibis-ci-key

          echo "S3_ACCESS_KEY=$(grep '^Key ID:' /tmp/garage/key-output.txt | awk '{print $3}')" >> "$GITHUB_ENV"
          echo "S3_SECRET_KEY=$(grep '^Secret key:' /tmp/garage/key-output.txt | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker-build:
    # Builds every image to catch a broken Dockerfile early. No push/deploy step yet -
    # staging/production hosting isn't decided (see CLAUDE.md "Still open").
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile apps/api

      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker apps/api

      - name: Build web image
        run: docker build -f apps/web/Dockerfile apps/web
