name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ifc_ibis
          POSTGRES_PASSWORD: ifc_ibis_dev
          POSTGRES_DB: ifc_ibis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ifc_ibis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ifc_ibis:ifc_ibis_dev@localhost:5432/ifc_ibis
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install node_fragments dependencies
        run: npm ci
        working-directory: apps/api/node_fragments

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker-build:
    # Builds every image to catch a broken Dockerfile early. No push/deploy step yet -
    # staging/production hosting isn't decided (see CLAUDE.md "Still open").
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f apps/api/Dockerfile apps/api

      - name: Build worker image
        run: docker build -f apps/api/Dockerfile.worker apps/api

      - name: Build web image
        run: docker build -f apps/web/Dockerfile apps/web
