[project]
name = "ifc-ibis-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Raza", email = "56381755+alithecoder98@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

# This is an application (FastAPI service), not a library — no wheel to build.
# uv manages the venv/lockfile only; run it with `uv run uvicorn app.main:app`.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
