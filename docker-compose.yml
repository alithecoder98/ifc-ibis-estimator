name: ifc-ibis-estimator

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ifc_ibis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ifc_ibis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ifc_ibis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ifc_ibis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for uploaded IFC files. MinIO's Docker Hub images now
  # require a paid account, so local/staging dev uses Garage instead (self-hosted, FOSS,
  # EU-hostable — see garage/garage.toml.example for setup).
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage/data
      - garage_meta:/var/lib/garage/meta
    ports:
      - "${GARAGE_S3_PORT:-3900}:3900"
      - "${GARAGE_ADMIN_PORT:-3903}:3903"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local/open-source model serving for Phase 3's Embedder (bge-m3) and LLMClient
  # (qwen2.5:7b-instruct) - decided 2026-10-13 over a paid API: no per-call cost, no
  # client data leaving the machine. GPU passthrough needs the host's nvidia container
  # runtime (confirmed present during setup); falls back to CPU if unavailable, just
  # slower. Pull models once with:
  #   docker compose exec ollama ollama pull bge-m3
  #   docker compose exec ollama ollama pull qwen2.5:7b-instruct
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  garage_data:
  garage_meta:
  ollama_data:
